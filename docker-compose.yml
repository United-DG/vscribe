
services:
  # Python transcription service
  transcriber:
    build:
      context: .
      dockerfile: Dockerfile.python
    ports:
      - "8000:8000"
    volumes:
      - ./cache/transcriptions:/app/cache/transcriptions
    environment:
      - WHISPER_MODEL=base
      - CACHE_MAX_AGE_DAYS=7
      - CACHE_MAX_FILES=100
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Self-hosted Argos translation service; models are downloaded on first start.
  translator:
    profiles: ["translation"]
    build:
      context: .
      dockerfile: Dockerfile.translation
    volumes:
      - argos_models:/root/.local/share/argos-translate
    environment:
      - TRANSLATION_PORT=8001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 2h

  # Node.js API gateway
  api:
    build:
      context: .
      dockerfile: Dockerfile.node
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
    environment:
      - GATEWAY_PORT=3001
      - PYTHON_SERVICE_URL=http://transcriber:8000
      - TRANSLATION_SERVICE_URL=http://translator:8001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=node
      - DB_PATH=/app/data/transcribe.db
      - BREVO_API_KEY=${BREVO_API_KEY}
      - MAIL_FROM=${MAIL_FROM:-noreply@frionode.online}
    depends_on:
      transcriber:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # Queue worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile.node
    command: pnpm exec ts-node worker/transcription.worker.ts
    volumes:
      - ./data:/app/data
    environment:
      - PYTHON_SERVICE_URL=http://transcriber:8000
      - TRANSLATION_SERVICE_URL=http://translator:8001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=node
      - DB_PATH=/app/data/transcribe.db
    depends_on:
      transcriber:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # Dedicated queue worker keeps Argos model execution isolated from transcription.
  translation-worker:
    profiles: ["translation"]
    build:
      context: .
      dockerfile: Dockerfile.node
    command: pnpm exec ts-node worker/translation.worker.ts
    environment:
      - TRANSLATION_SERVICE_URL=http://translator:8001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=node
      - DB_PATH=/app/data/transcribe.db
    depends_on:
      translator:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass node --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
  argos_models:
