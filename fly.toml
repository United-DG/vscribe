# fly.toml app configuration file generated for transcribe on 2026-05-29T14:32:18+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'transcribe'
primary_region = 'jnb'

[build]


[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[mounts]
  source = "transcribe_data"
  destination = "/data"

[env]
  PYTHON_SERVICE_URL = "http://localhost:8000"
  API_BASE_URL = "https://vscribe.frionode.online/api/v1"
  DB_PATH = "/data/transcribe.db"

[[vm]]
  cpu_kind = 'shared'
  cpus = 2
  memory = '4096mb'
